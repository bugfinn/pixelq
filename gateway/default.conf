# Only POST requests get a key, so only uploads are counted.
# GET requests (the page polls every 2 seconds) get an empty key and are never limited.
map $request_method $upload_key {
    default "";
    POST    $binary_remote_addr;
}

# 30 uploads per minute per client IP.
limit_req_zone $upload_key zone=uploads:1m rate=30r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above 10 MB so a valid 10 MB file is not rejected for multipart overhead.
    # The API still enforces exactly 10 MB.
    client_max_body_size 11m;

    # Security headers. (Do not add add_header inside a location: it would drop these.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Docker's built-in DNS. Lets Nginx find the api container again after it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=uploads burst=10 nodelay;

        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Vite puts a hash in these file names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}