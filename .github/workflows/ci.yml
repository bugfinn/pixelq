name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Same project name as a local checkout, so compose finds the prebuilt
  # images (pixelq-api, pixelq-worker, pixelq-gateway) instead of rebuilding.
  COMPOSE_PROJECT_NAME: pixelq
  COMPOSE_FILE: docker-compose.yml

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token. The AWS role only accepts
      # tokens from pushes to main, so pull requests cannot use it.
      id-token: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (pnpm version comes from package.json)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build packages
        run: pnpm -r --if-present run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build images (with layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            api.tags=pixelq-api:latest
            worker.tags=pixelq-worker:latest
            gateway.tags=pixelq-gateway:latest
            api.cache-from=type=gha,scope=pixelq-api
            api.cache-to=type=gha,scope=pixelq-api,mode=max
            worker.cache-from=type=gha,scope=pixelq-worker
            worker.cache-to=type=gha,scope=pixelq-worker,mode=max
            gateway.cache-from=type=gha,scope=pixelq-gateway
            gateway.cache-to=type=gha,scope=pixelq-gateway,mode=max

      - name: Scan images with Trivy
        run: bash scripts/scan-images.sh

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Verify hardening
        run: bash scripts/verify-hardening.sh

      - name: Show container state and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=100 || true

      # Publishing: only for pushes to main, only after every check above passed,
      # and only when the two repository variables exist.
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECR_PUBLIC_ALIAS != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECR_PUBLIC_ALIAS != ''
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Push images to ECR Public (tagged with the commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECR_PUBLIC_ALIAS != ''
        env:
          REGISTRY: public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}
        run: |
          for NAME in api worker gateway; do
            docker tag "pixelq-$NAME:latest" "$REGISTRY/pixelq-$NAME:$GITHUB_SHA"
            docker push "$REGISTRY/pixelq-$NAME:$GITHUB_SHA"
          done