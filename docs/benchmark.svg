<text x="113.3" y="352" font-size="12" text-anchor="middle" fill="#222">1 worker</text>
<rect x="195.7" y="214.1" width="84.7" height="115.9" fill="#2b7de9"/>
<text x="238.0" y="208.1" font-size="12" text-anchor="middle" fill="#222">2.51</text>
<text x="240.0" y="352" font-size="12" text-anchor="middle" fill="#222">2 workers</text>
<rect x="322.3" y="155.0" width="84.7" height="175.0" fill="#2b7de9"/>
