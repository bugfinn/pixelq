services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: pixelq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelq_dev}
      POSTGRES_DB: pixelq
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelq -d pixelq"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  pgdata:
